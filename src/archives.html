<include src="layout.html">
  <template name="head">
    <title th:text="${#messages.msg('page.archives.title') + ' - ' + site.title}">归档 - 山月记</title>
  </template>

  <section class="listing-page container">
    <header class="listing-hero">
      <h1 th:text="#{page.archives.heading}">文章归档</h1>
      <p th:text="#{page.archives.description}">沿着时间，重读写下的痕迹。</p>
    </header>

    <p class="empty-state" th:if="${#lists.isEmpty(archives.items)}" th:text="#{page.archives.empty}">还没有可归档的文章。</p>
    <ul class="post-list" th:if="${not #lists.isEmpty(archives.items)}">
      <th:block th:each="archive : ${archives.items}">
        <th:block th:each="month : ${archive.months}">
          <li class="post-card" th:each="post : ${month.posts}">
            <a class="post-card__media" th:href="@{${post.status.permalink}}" tabindex="-1">
              <img
                th:src="${(not #strings.isEmpty(post.spec.cover) and post.spec.cover != '0') ? post.spec.cover : #theme.assets('/images/moonlit-mountain-hero.jpg')}"
                th:alt="${post.spec.title}"
                loading="lazy"
              />
            </a>
            <div class="post-card__body">
              <p class="post-meta">
                <time th:text="${#temporals.format(post.spec.publishTime, #messages.msg('date.format.short'))}">2026.07.10</time>
                <span th:if="${not #lists.isEmpty(post.categories)}">
                  · <span th:text="${post.categories[0].spec.displayName}">随笔</span>
                </span>
              </p>
              <h2><a th:href="@{${post.status.permalink}}" th:text="${post.spec.title}">文章标题</a></h2>
              <p class="post-card__excerpt" th:text="${post.status.excerpt}">文章摘要</p>
            </div>
          </li>
        </th:block>
      </th:block>
    </ul>

    <nav class="pagination" aria-label="归档分页" th:aria-label="#{common.pagination}" th:if="${archives.hasPrevious() || archives.hasNext()}">
      <a th:if="${archives.hasPrevious()}" th:href="@{${archives.prevUrl}}" th:text="${'← ' + #messages.msg('common.previousPage')}">← 上一页</a>
      <span th:text="|${archives.page} / ${archives.totalPages}|">1 / 1</span>
      <a th:if="${archives.hasNext()}" th:href="@{${archives.nextUrl}}" th:text="${#messages.msg('common.nextPage') + ' →'}">下一页 →</a>
    </nav>
  </section>
</include>
