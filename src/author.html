<include src="layout.html">
  <template name="head">
    <title th:text="|${author.spec.displayName} - ${site.title}|">作者 - 山月记</title>
  </template>

  <section class="listing-page container">
    <header class="listing-hero">
      <p class="eyebrow" th:text="#{page.author.eyebrow}">AUTHOR</p>
      <h1 th:text="${author.spec.displayName}">作者</h1>
      <p th:if="${not #strings.isEmpty(author.spec.bio)}" th:text="${author.spec.bio}"></p>
    </header>
    <p class="empty-state" th:if="${#lists.isEmpty(posts.items)}" th:text="#{page.author.empty}">这位作者暂时没有文章。</p>
    <ul class="post-list">
      <include src="post-card.html"></include>
    </ul>
    <include src="pagination.html"></include>
  </section>
</include>
