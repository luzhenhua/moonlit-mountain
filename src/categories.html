<include src="layout.html">
  <template name="head">
    <title th:text="${#messages.msg('page.categories.title') + ' - ' + site.title}">分类 - 山月记</title>
  </template>

  <section class="listing-page container">
    <header class="listing-hero">
      <p class="eyebrow" th:text="#{page.categories.eyebrow}">CATEGORIES</p>
      <h1 th:text="#{page.categories.heading}">文章分类</h1>
      <p th:text="#{page.categories.description}">从不同路径进入同一片思想的山林。</p>
    </header>

    <p class="empty-state" th:if="${#lists.isEmpty(categories)}" th:text="#{page.categories.empty}">还没有文章分类。</p>

    <ul class="taxonomy-grid taxonomy-tree" th:fragment="categoryTree(categories)" th:if="${not #lists.isEmpty(categories)}">
      <li th:each="category : ${categories}">
        <a th:href="@{${category.status.permalink}}">
          <span th:text="${category.spec.displayName}">分类名称</span>
          <strong th:text="${category.postCount}">0</strong>
        </a>
        <th:block
          th:if="${not #lists.isEmpty(category.children)}"
          th:replace="~{categories :: categoryTree(categories=${category.children})}"
        ></th:block>
      </li>
    </ul>

  </section>
</include>
