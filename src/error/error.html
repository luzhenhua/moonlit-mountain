<include src="error-layout.html">
  <template name="head">
    <title th:text="${#messages.msg('error.metaTitle', error.status ?: 500, site.title)}"></title>
  </template>

  <section class="error-page container">
    <div th:with="statusCode = ${error.status ?: 500}">
      <p class="eyebrow" th:text="#{error.eyebrow}"></p>
      <h1 th:text="${statusCode}">404</h1>
      <h2 th:if="${statusCode == 404}" th:text="#{error.notFound.title}"></h2>
      <h2 th:if="${statusCode >= 400 and statusCode < 500 and statusCode != 404}" th:text="#{error.client.title}"></h2>
      <h2 th:if="${statusCode >= 500}" th:text="#{error.server.title}"></h2>
      <h2 th:if="${statusCode < 400}" th:text="#{error.other.title}"></h2>
      <p th:if="${statusCode == 404}" th:text="#{error.notFound.description}"></p>
      <p th:if="${statusCode != 404}" th:text="#{error.generic.description}"></p>
      <a class="button button--primary" th:href="@{/}" th:text="#{error.backHome}"></a>
    </div>
  </section>
</include>
