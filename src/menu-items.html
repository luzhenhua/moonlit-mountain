<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="items(items, level)">
  <li
    th:each="item : ${items}"
    th:classappend="${not #lists.isEmpty(item.children)} ? 'has-children'"
    th:attr="data-menu-level=${level}"
  >
    <a
      th:href="@{${item.status.href}}"
      th:target="${item.spec.target?.value}"
      th:rel="${item.spec.target?.value == '_blank' ? 'noopener noreferrer' : null}"
    >
      <span th:text="${item.status.displayName}"></span>
    </a>
    <button
      class="submenu-toggle"
      type="button"
      aria-expanded="false"
      th:if="${not #lists.isEmpty(item.children)}"
      th:attr="aria-controls=|submenu-${item.metadata.name}|,data-submenu-label=${item.status.displayName}"
      th:aria-label="${#messages.msg('nav.submenu.expand', item.status.displayName)}"
      data-submenu-toggle
    >
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
    </button>
    <ul
      class="submenu"
      th:id="|submenu-${item.metadata.name}|"
      th:if="${not #lists.isEmpty(item.children)}"
      th:attr="data-submenu-level=${level}"
    >
      <th:block th:replace="~{menu-items :: items(${item.children}, ${level + 1})}"></th:block>
    </ul>
  </li>
</th:block>
