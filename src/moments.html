<include src="layout.html">
  <template name="head">
    <title th:text="|${title ?: #messages.msg('page.moments.title')} - ${site.title}|"></title>
  </template>

  <section class="moment-page">
    <header class="moment-page__hero">
      <h1 th:text="#{page.moments.heading}"></h1>
      <p th:text="#{page.moments.description}"></p>
      <p class="moment-page__filter-state" th:if="${not #lists.isEmpty(param.tag)}">
        <span th:text="${#messages.msg('page.moments.filtering', param.tag[0])}"></span>
        <a th:href="@{/moments}" th:text="#{page.moments.viewAll}"></a>
      </p>
    </header>

    <th:block th:if="${pluginFinder.available('PluginMoments', '>=1.16.1')}">
      <div class="moment-stream" th:if="${not #lists.isEmpty(moments.items)}">
        <th:block
          th:each="yearSource, yearStat : ${moments.items}"
          th:with="
            yearSourceTime = ${yearSource.spec.releaseTime ?: yearSource.metadata.creationTimestamp},
            previousSource = ${yearStat.first ? null : moments.items[yearStat.index - 1]},
            previousSourceTime = ${previousSource == null ? null : (previousSource.spec.releaseTime ?: previousSource.metadata.creationTimestamp)}
          "
        >
          <section
            class="moment-year-group"
            th:if="${yearStat.first or #temporals.format(yearSourceTime, 'yyyy') != #temporals.format(previousSourceTime, 'yyyy')}"
            th:attr="id=|moments-${#temporals.format(yearSourceTime, 'yyyy')}|,aria-labelledby=|moments-${#temporals.format(yearSourceTime, 'yyyy')}-title|"
          >
            <header class="moment-year-rail">
              <span class="moment-year-rail__node" aria-hidden="true"><span></span></span>
              <h2
                th:id="|moments-${#temporals.format(yearSourceTime, 'yyyy')}-title|"
                th:text="${#temporals.format(yearSourceTime, 'yyyy')}"
              >
              </h2>
            </header>

            <div class="moment-year-group__cards">
              <th:block
                th:each="moment, momentStat : ${moments.items}"
                th:with="
                  releaseTime = ${moment.spec.releaseTime ?: moment.metadata.creationTimestamp},
                  momentDetail = false,
                  momentIndex = ${momentStat.index}
                "
              >
                <th:block th:if="${#temporals.format(releaseTime, 'yyyy') == #temporals.format(yearSourceTime, 'yyyy')}">
                  <include src="moment-entry.html"></include>
                </th:block>
              </th:block>
            </div>
          </section>
        </th:block>
      </div>

      <div class="empty-state moment-empty" th:if="${#lists.isEmpty(moments.items)}">
        <span class="moment-empty__signal" aria-hidden="true"><span></span></span>
        <h2 th:text="#{page.moments.empty.title}"></h2>
        <p th:text="#{page.moments.empty.description}"></p>
      </div>

      <nav
        class="pagination moment-pagination"
        th:aria-label="#{page.moments.pagination.ariaLabel}"
        th:if="${moments.hasPrevious() || moments.hasNext()}"
      >
        <a
          th:if="${moments.hasPrevious()}"
          th:href="@{${moments.prevUrl}}"
          rel="prev"
          th:text="#{common.previousPage}"
        ></a>
        <span><strong th:text="${moments.page}"></strong> / <span th:text="${moments.totalPages}"></span></span>
        <a th:if="${moments.hasNext()}" th:href="@{${moments.nextUrl}}" rel="next" th:text="#{common.nextPage}"></a>
      </nav>
    </th:block>

    <div class="empty-state moment-empty" th:unless="${pluginFinder.available('PluginMoments', '>=1.16.1')}">
      <h2 th:text="#{page.moments.pluginRequired.title}"></h2>
      <p th:text="#{page.moments.pluginRequired.description}"></p>
    </div>

    <p class="sr-only" aria-live="polite" data-moment-feedback></p>
  </section>
</include>
