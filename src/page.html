<include src="layout.html">
  <template name="head">
    <title th:text="|${singlePage.spec.title} - ${site.title}|">页面标题 - 山月记</title>
  </template>

  <article class="article-shell container">
    <header class="article-hero">
      <p class="eyebrow" th:text="#{common.page}">PAGE</p>
      <h1 th:text="${singlePage.spec.title}">页面标题</h1>
    </header>
    <img
      class="article-cover"
      th:if="${not #strings.isEmpty(singlePage.spec.cover) and singlePage.spec.cover != '0'}"
      th:src="${singlePage.spec.cover}"
      th:alt="${singlePage.spec.title}"
    />
    <div class="article-content" th:utext="${singlePage.content.content}"></div>
  </article>

  <section class="comment-shell container" th:if="${haloCommentEnabled}">
    <halo:comment
      group="content.halo.run"
      kind="SinglePage"
      th:attr="name=${singlePage.metadata.name}"
    />
  </section>
</include>
