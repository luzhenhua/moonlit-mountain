<li
  class="link-feed-entry"
  th:attr="data-feed-id=${feed.id}"
  th:with="
    feedTitle = ${#strings.isEmpty(feed.title) ? #messages.msg('link.feed.untitled') : feed.title},
    feedUrlValue = ${feed.url ?: ''},
    feedUrlLower = ${#strings.toLowerCase(feedUrlValue)},
    feedUrl = ${(#strings.startsWith(feedUrlLower, 'https://') or #strings.startsWith(feedUrlLower, 'http://')) ? feedUrlValue : ''},
    feedSummary = ${feed.summary ?: ''},
    feedAuthor = ${#strings.isEmpty(feed.author) ? #messages.msg('link.feed.neighbor') : feed.author},
    feedAuthorUrlValue = ${feed.authorUrl ?: ''},
    feedAuthorUrlLower = ${#strings.toLowerCase(feedAuthorUrlValue)},
    feedAuthorUrl = ${(#strings.startsWith(feedAuthorUrlLower, 'https://') or #strings.startsWith(feedAuthorUrlLower, 'http://')) ? feedAuthorUrlValue : ''},
    feedAuthorLogo = ${feed.authorLogo ?: ''},
    feedTime = ${feed.publishedAt ?: (feed.updatedAt ?: feed.fetchedAt)}
  "
>
  <a
    class="link-feed-entry__source"
    th:if="${not #strings.isEmpty(feedAuthorUrl)}"
    th:href="@{${feedAuthorUrl}}"
    target="_blank"
    rel="noopener noreferrer external"
    th:aria-label="${#messages.msg('link.feed.visitSource', feedAuthor)}"
  >
    <span class="link-feed-entry__logo" th:classappend="${#strings.isEmpty(feedAuthorLogo)} ? ' is-fallback'">
      <img
        th:if="${not #strings.isEmpty(feedAuthorLogo)}"
        th:src="${feedAuthorLogo}"
        alt=""
        width="18"
        height="18"
        loading="lazy"
        decoding="async"
        data-feed-logo
      />
      <span aria-hidden="true" th:text="${#strings.substring(feedAuthor, 0, 1)}">友</span>
    </span>
    <span th:text="${feedAuthor}">友邻站点</span>
  </a>
  <span class="link-feed-entry__source link-feed-entry__source--static" th:unless="${not #strings.isEmpty(feedAuthorUrl)}">
    <span class="link-feed-entry__logo" th:classappend="${#strings.isEmpty(feedAuthorLogo)} ? ' is-fallback'">
      <img
        th:if="${not #strings.isEmpty(feedAuthorLogo)}"
        th:src="${feedAuthorLogo}"
        alt=""
        width="18"
        height="18"
        loading="lazy"
        decoding="async"
        data-feed-logo
      />
      <span aria-hidden="true" th:text="${#strings.substring(feedAuthor, 0, 1)}">友</span>
    </span>
    <span th:text="${feedAuthor}">友邻站点</span>
  </span>

  <a
    class="link-feed-entry__story"
    th:if="${not #strings.isEmpty(feedUrl)}"
    th:href="@{${feedUrl}}"
    target="_blank"
    rel="noopener noreferrer external"
    th:aria-label="${#messages.msg('link.feed.readStory', feedAuthor, feedTitle)}"
  >
    <strong th:text="${feedTitle}">文章标题</strong>
    <span class="link-feed-entry__summary" th:if="${not #strings.isEmpty(feedSummary)}" th:text="${feedSummary}">文章摘要</span>
    <time class="link-feed-entry__time" th:if="${feedTime != null}" th:datetime="${feedTime}">
      <span th:text="${#temporals.format(feedTime, #messages.msg('date.format.short'))}"></span>
      <span aria-hidden="true">•</span>
      <small th:text="${#temporals.format(feedTime, #messages.msg('date.format.time'))}"></small>
    </time>
    <span class="link-feed-entry__time link-feed-entry__time--unknown" th:unless="${feedTime != null}" th:text="#{link.feed.timeUnknown}"></span>
    <span class="link-feed-entry__cta" aria-hidden="true">
      <span th:text="#{link.feed.read}"></span>
      <svg viewBox="0 0 24 24"><path d="M17 7 7 17M8 7h9v9" /></svg>
    </span>
  </a>
  <div class="link-feed-entry__story link-feed-entry__story--static" th:unless="${not #strings.isEmpty(feedUrl)}">
    <strong th:text="${feedTitle}">文章标题</strong>
    <span class="link-feed-entry__summary" th:if="${not #strings.isEmpty(feedSummary)}" th:text="${feedSummary}">文章摘要</span>
    <time class="link-feed-entry__time" th:if="${feedTime != null}" th:datetime="${feedTime}">
      <span th:text="${#temporals.format(feedTime, #messages.msg('date.format.short'))}"></span>
      <span aria-hidden="true">•</span>
      <small th:text="${#temporals.format(feedTime, #messages.msg('date.format.time'))}"></small>
    </time>
    <span class="link-feed-entry__time link-feed-entry__time--unknown" th:unless="${feedTime != null}" th:text="#{link.feed.timeUnknown}"></span>
    <span class="link-feed-entry__unavailable" th:text="#{link.feed.unavailable}"></span>
  </div>
  <span class="link-feed-entry__spectral-line" aria-hidden="true"></span>
</li>
