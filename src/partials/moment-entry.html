<article
  class="moment-entry"
  th:classappend="${momentDetail} ? 'moment-entry--detail' : ''"
  th:with="
    content = ${moment.spec.content},
    releaseTime = ${moment.spec.releaseTime ?: moment.metadata.creationTimestamp},
    ownerName = ${moment.owner != null and not #strings.isEmpty(moment.owner.displayName) ? moment.owner.displayName : '站点作者'},
    ownerAvatar = ${moment.owner?.avatar ?: ''},
    momentUrl = @{/moments/{name}(name=${moment.metadata.name})}
  "
  th:aria-label="|${ownerName} 于 ${#temporals.format(releaseTime, 'yyyy年MM月dd日 HH:mm')} 发布的瞬间|"
  data-reveal
>
  <div class="moment-entry__card">
    <header class="moment-entry__meta">
      <time th:datetime="${releaseTime}">
        <span th:text="${#temporals.format(releaseTime, 'yyyy年M月d日')}">2026年7月15日</span>
        <small th:text="${#temporals.format(releaseTime, 'HH:mm')}">21:30</small>
      </time>
      <button
        class="moment-action moment-action--upvote"
        type="button"
        th:attr="data-moment-name=${moment.metadata.name}"
        data-moment-upvote
        aria-pressed="false"
        aria-label="喜欢这个瞬间"
      >
        <span data-moment-upvote-count th:text="${moment.stats?.upvote ?: 0}">0</span>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 1 0-7.6 7.6l1.2 1.2L12 21l7.6-7.6 1.2-1.2a5.4 5.4 0 0 0 0-7.6Z" /></svg>
        <span class="moment-action__label">喜欢</span>
      </button>
    </header>

    <div class="moment-entry__author">
      <img
        th:if="${not #strings.isEmpty(ownerAvatar)}"
        th:src="${ownerAvatar}"
        alt=""
        width="40"
        height="40"
        loading="lazy"
        decoding="async"
      />
      <img
        class="moment-entry__avatar-fallback"
        th:unless="${not #strings.isEmpty(ownerAvatar)}"
        th:src="${not #strings.isEmpty(site.logo) ? site.logo : #theme.assets('/images/moonlit-mountain-hero.jpg')}"
        alt=""
        width="40"
        height="40"
        loading="lazy"
        decoding="async"
      />
    </div>

    <h3 class="moment-entry__title" th:if="${not momentDetail}">
      <a th:href="${momentUrl}" th:text="${ownerName}">站点作者</a>
    </h3>
    <h2 class="moment-entry__title" th:if="${momentDetail}" th:text="${ownerName}">站点作者</h2>

    <div
      class="moment-entry__content"
      th:if="${content != null and not #strings.isEmpty(content.html)}"
      th:utext="${content.html}"
    ></div>

    <div class="moment-media" th:if="${content != null and not #lists.isEmpty(content.medium)}">
      <th:block th:each="media, mediaStat : ${content.medium}">
        <a
          class="moment-media__photo"
          th:if="${#strings.equals(media.type, 'PHOTO')}"
          th:href="@{${media.url}}"
          target="_blank"
          rel="noopener noreferrer"
          th:aria-label="|在新标签页查看 ${ownerName} 发布的第 ${mediaStat.count} 张瞬间原图|"
        >
          <img
            th:src="${thumbnail.gen(media.url, 'm')}"
            th:srcset="|${thumbnail.gen(media.url, 's')} 400w, ${thumbnail.gen(media.url, 'm')} 800w, ${thumbnail.gen(media.url, 'l')} 1200w|"
            sizes="(max-width: 767px) calc(100vw - 128px), (max-width: 1279px) 60vw, 350px"
            th:alt="|${ownerName} 发布的瞬间图片|"
            th:attr="loading=${momentDetail and mediaStat.first ? 'eager' : 'lazy'},fetchpriority=${momentDetail and mediaStat.first ? 'high' : null}"
            decoding="async"
          />
          <span>查看原图</span>
        </a>

        <div class="moment-media__video" th:if="${#strings.equals(media.type, 'VIDEO')}">
          <video controls playsinline th:attr="preload=${momentDetail ? 'metadata' : 'none'}">
            <source th:src="${media.url}" th:attr="type=${#strings.isEmpty(media.originType) ? null : media.originType}" />
            您的浏览器不支持视频播放，<a th:href="@{${media.url}}">可直接打开视频</a>。
          </video>
        </div>

        <div class="moment-media__audio" th:if="${#strings.equals(media.type, 'AUDIO')}">
          <span class="moment-media__audio-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M9 18V5l10-2v13M9 9l10-2M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM16 19a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" /></svg>
          </span>
          <div>
            <strong>声音片段</strong>
            <audio controls th:attr="preload=${momentDetail ? 'metadata' : 'none'}">
              <source th:src="${media.url}" th:attr="type=${#strings.isEmpty(media.originType) ? null : media.originType}" />
              您的浏览器不支持音频播放，<a th:href="@{${media.url}}">可直接打开音频</a>。
            </audio>
          </div>
        </div>

        <a class="moment-media__post" th:if="${#strings.equals(media.type, 'POST')}" th:href="@{${media.url}}">
          <span class="moment-media__post-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6zM9 10h6M9 14h6M9 18h4M15 3v4h4" /></svg>
          </span>
          <span><small>关联文章</small><strong>继续阅读这一刻的故事</strong></span>
          <svg class="moment-media__post-arrow" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
        </a>

        <a
          class="moment-media__post"
          th:unless="${#strings.equals(media.type, 'PHOTO') or #strings.equals(media.type, 'VIDEO') or #strings.equals(media.type, 'AUDIO') or #strings.equals(media.type, 'POST')}"
          th:href="@{${media.url}}"
        >
          <span class="moment-media__post-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14" /></svg>
          </span>
          <span><small>附件</small><strong>打开这个瞬间的附件</strong></span>
          <svg class="moment-media__post-arrow" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
        </a>
      </th:block>
    </div>

    <footer class="moment-entry__footer">
      <ul class="moment-tags" th:if="${not #lists.isEmpty(moment.spec.tags)}" aria-label="瞬间标签">
        <li th:each="tag : ${moment.spec.tags}">
          <a
            th:href="@{/moments(tag=${tag})}"
            th:text="${tag}"
            th:attr="aria-current=${#lists.contains(param.tag, tag) ? 'page' : null}"
          >标签</a>
        </li>
      </ul>
      <div class="moment-entry__actions">
        <a class="moment-entry__open" th:if="${not momentDetail}" th:href="${momentUrl}">
          <span>查看</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M17 7 7 17M8 7h9v9" /></svg>
        </a>
        <a
          class="moment-action moment-action--comment"
          th:if="${not momentDetail or haloCommentEnabled}"
          th:href="${momentDetail ? '#moment-comments' : #strings.concat(momentUrl, '#moment-comments')}"
          th:aria-label="|查看评论，共 ${moment.stats?.approvedComment ?: 0} 条|"
        >
          <span>回应</span>
          <span th:text="${moment.stats?.approvedComment ?: 0}">0</span>
        </a>
        <span
          class="moment-action moment-action--comment moment-action--static"
          th:if="${momentDetail and not haloCommentEnabled}"
          th:aria-label="|评论功能未开启，共 ${moment.stats?.approvedComment ?: 0} 条历史评论|"
        >
          <span>回应</span>
          <span th:text="${moment.stats?.approvedComment ?: 0}">0</span>
        </span>
      </div>
    </footer>
  </div>
</article>
