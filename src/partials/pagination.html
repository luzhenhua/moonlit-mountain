<nav class="pagination" aria-label="分页" th:aria-label="#{common.pagination}" th:if="${posts.hasPrevious() || posts.hasNext()}">
  <a th:if="${posts.hasPrevious()}" th:href="@{${posts.prevUrl}}" th:text="${'← ' + #messages.msg('common.previousPage')}">← 上一页</a>
  <span th:text="|${posts.page} / ${posts.totalPages}|">1 / 1</span>
  <a th:if="${posts.hasNext()}" th:href="@{${posts.nextUrl}}" th:text="${#messages.msg('common.nextPage') + ' →'}">下一页 →</a>
</nav>
