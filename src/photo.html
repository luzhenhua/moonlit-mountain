<include src="layout.html">
  <template name="head">
    <title th:text="|${title ?: #messages.msg('page.photo.title')} - ${site.title}|"></title>
  </template>

  <article class="photo-detail container">
    <header class="photo-detail__toolbar">
      <a class="photo-back" th:href="@{${backUrl}}">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
        <span th:text="#{page.photo.backToGallery}"></span>
      </a>
      <p class="photo-detail__position">
        <span th:text="#{page.photo.frame}"></span>
        <strong th:text="${position}"></strong>
        <span>/</span>
        <span th:text="${total}"></span>
      </p>
    </header>

    <figure class="photo-stage">
      <div class="photo-stage__media">
        <img
          th:src="${thumbnail.gen(photo.spec.url, 'l')}"
          th:srcset="|${thumbnail.gen(photo.spec.url, 's')} 400w, ${thumbnail.gen(photo.spec.url, 'm')} 800w, ${thumbnail.gen(photo.spec.url, 'l')} 1200w|"
          sizes="(max-width: 767px) calc(100vw - 52px), min(1170px, calc(100vw - 112px))"
          th:alt="${#strings.isEmpty(photo.spec.displayName) ? #messages.msg('page.photo.imageAlt') : photo.spec.displayName}"
          th:attr="width=${photo.exif != null ? photo.exif.imageWidth : null},height=${photo.exif != null ? photo.exif.imageHeight : null}"
          decoding="async"
          fetchpriority="high"
        />
        <a
          class="photo-original"
          th:href="@{${photo.spec.url}}"
          target="_blank"
          rel="noopener noreferrer"
          th:aria-label="#{page.photo.original.ariaLabel}"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-7 7M19 14v5H5V5h5" /></svg>
          <span th:text="#{page.photo.original.label}"></span>
        </a>
      </div>

      <figcaption class="photo-caption">
        <div class="photo-caption__copy">
          <p class="eyebrow" th:text="#{page.photo.eyebrow}"></p>
          <h1
            th:text="${#strings.isEmpty(photo.spec.displayName) ? (title ?: #messages.msg('page.photo.unnamed')) : photo.spec.displayName}"
          ></h1>
          <p class="photo-caption__description" th:if="${not #strings.isEmpty(photo.spec.description)}" th:text="${photo.spec.description}">
          </p>
          <ul class="photo-tags" th:if="${not #lists.isEmpty(photo.spec.tags)}" th:aria-label="#{page.photo.tags.ariaLabel}">
            <li th:each="tag : ${photo.spec.tags}"><span>#</span><span th:text="${tag}"></span></li>
          </ul>
        </div>

        <dl class="photo-exif" th:if="${photo.exif != null}">
          <div th:if="${not #strings.isEmpty(photo.exif.make) or not #strings.isEmpty(photo.exif.model)}">
            <dt th:text="#{page.photo.exif.camera}"></dt>
            <dd th:text="|${photo.exif.make ?: ''} ${photo.exif.model ?: ''}|"></dd>
          </div>
          <div th:if="${not #strings.isEmpty(photo.exif.lensModel)}">
            <dt th:text="#{page.photo.exif.lens}"></dt>
            <dd th:text="${photo.exif.lensModel}"></dd>
          </div>
          <div th:if="${photo.exif.fNumber != null}">
            <dt th:text="#{page.photo.exif.aperture}"></dt>
            <dd th:text="|f/${photo.exif.fNumber}|"></dd>
          </div>
          <div th:if="${not #strings.isEmpty(photo.exif.exposureTime)}">
            <dt th:text="#{page.photo.exif.shutter}"></dt>
            <dd th:text="${photo.exif.exposureTime}"></dd>
          </div>
          <div th:if="${photo.exif.iso != null}">
            <dt th:text="#{page.photo.exif.iso}"></dt>
            <dd th:text="${photo.exif.iso}"></dd>
          </div>
          <div th:if="${photo.exif.focalLength != null}">
            <dt th:text="#{page.photo.exif.focalLength}"></dt>
            <dd th:text="|${photo.exif.focalLength} mm|"></dd>
          </div>
          <div th:if="${photo.exif.imageWidth != null and photo.exif.imageHeight != null}">
            <dt th:text="#{page.photo.exif.dimensions}"></dt>
            <dd th:text="|${photo.exif.imageWidth} × ${photo.exif.imageHeight}|"></dd>
          </div>
          <div th:if="${photo.exif.dateTimeOriginal != null}">
            <dt th:text="#{page.photo.exif.capturedAt}"></dt>
            <dd
              th:text="${#temporals.format(photo.exif.dateTimeOriginal, #messages.msg('date.format.dateTime'))}"
            ></dd>
          </div>
        </dl>
      </figcaption>
    </figure>

    <nav class="photo-stepper" th:aria-label="#{page.photo.stepper.ariaLabel}">
      <a
        class="photo-stepper__edge photo-stepper__edge--previous"
        th:if="${prev != null}"
        th:href="@{${photoUrl.detail(prev)}}"
        th:title="${#strings.isEmpty(prev.spec.displayName) ? #messages.msg('page.photo.unnamed') : prev.spec.displayName}"
        aria-keyshortcuts="ArrowLeft"
        data-photo-previous
      >
        <span th:text="|← ${#messages.msg('page.photo.previous')}|"></span>
        <strong
          th:text="${#strings.isEmpty(prev.spec.displayName) ? #messages.msg('page.photo.unnamed') : prev.spec.displayName}"
        ></strong>
      </a>
      <span class="photo-stepper__edge is-disabled" th:if="${prev == null}" aria-hidden="true"></span>
      <span class="photo-stepper__counter" th:text="|${position} / ${total}|"></span>
      <a
        class="photo-stepper__edge photo-stepper__edge--next"
        th:if="${next != null}"
        th:href="@{${photoUrl.detail(next)}}"
        th:title="${#strings.isEmpty(next.spec.displayName) ? #messages.msg('page.photo.unnamed') : next.spec.displayName}"
        aria-keyshortcuts="ArrowRight"
        data-photo-next
      >
        <span th:text="|${#messages.msg('page.photo.next')} →|"></span>
        <strong
          th:text="${#strings.isEmpty(next.spec.displayName) ? #messages.msg('page.photo.unnamed') : next.spec.displayName}"
        ></strong>
      </a>
      <span class="photo-stepper__edge is-disabled" th:if="${next == null}" aria-hidden="true"></span>
    </nav>

    <nav class="photo-filmstrip" th:aria-label="#{page.photo.neighbors.ariaLabel}" th:if="${not #lists.isEmpty(neighbors)}">
      <div class="photo-filmstrip__track">
        <a
          th:each="neighbor : ${neighbors}"
          th:with="neighborImage=${not #strings.isEmpty(neighbor.spec.cover) ? neighbor.spec.cover : neighbor.spec.url}"
          th:href="@{${photoUrl.detail(neighbor)}}"
          th:classappend="${neighbor.metadata.name == photo.metadata.name} ? ' is-current' : ''"
          th:attr="aria-current=${neighbor.metadata.name == photo.metadata.name ? 'true' : null}"
          th:aria-label="${#messages.msg('page.photo.neighbors.view', #strings.isEmpty(neighbor.spec.displayName) ? #messages.msg('page.photo.unnamed') : neighbor.spec.displayName)}"
        >
          <img
            th:src="${thumbnail.gen(neighborImage, 's')}"
            th:alt="${#strings.isEmpty(neighbor.spec.displayName) ? #messages.msg('page.photo.neighbors.imageAlt') : neighbor.spec.displayName}"
            loading="lazy"
            decoding="async"
          />
          <span
            th:text="${#strings.isEmpty(neighbor.spec.displayName) ? #messages.msg('page.photo.unnamed') : neighbor.spec.displayName}"
          ></span>
        </a>
      </div>
    </nav>
  </article>

  <section class="comment-shell photo-comment-shell container" th:if="${haloCommentEnabled}">
    <h2 th:text="#{page.photo.comments.title}"></h2>
    <halo:comment group="core.halo.run" kind="Photo" th:attr="name=${photo.metadata.name}" />
  </section>
</include>
