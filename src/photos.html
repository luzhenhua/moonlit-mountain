<include src="layout.html">
  <template name="head">
    <title th:text="|${title ?: #messages.msg('page.photos.title')} - ${site.title}|"></title>
  </template>

  <section class="photo-gallery container">
    <header class="photo-gallery__hero">
      <div>
        <p class="eyebrow" th:text="#{page.photos.eyebrow}"></p>
        <h1 th:text="${title ?: #messages.msg('page.photos.title')}"></h1>
        <p th:text="#{page.photos.description}"></p>
      </div>
      <p class="photo-gallery__count" th:if="${photos.total > 0}">
        <strong th:text="${photos.total}"></strong>
        <span th:text="${photos.total == 1 ? #messages.msg('page.photos.countUnit.one') : #messages.msg('page.photos.countUnit.other')}"></span>
      </p>
    </header>

    <th:block th:if="${pluginFinder.available('PluginPhotos', '>=2.0.0')}">
      <nav class="photo-filters" th:aria-label="#{page.photos.filters.ariaLabel}" th:if="${not #lists.isEmpty(groups)}">
        <a class="photo-filter" th:href="@{${photoUrl.list('', 1, photos.size)}}" data-photo-filter data-photo-group="">
          <span th:text="#{common.all}"></span>
        </a>
        <a
          class="photo-filter"
          th:each="group : ${groups}"
          th:href="@{${photoUrl.list(group.metadata.name, 1, photos.size)}}"
          th:attr="data-photo-group=${group.metadata.name}"
          data-photo-filter
        >
          <span th:text="${group.spec.displayName}"></span>
          <small th:text="${group.status?.photoCount ?: 0}"></small>
        </a>
      </nav>

      <div class="photo-wall" th:if="${not #lists.isEmpty(photos.items)}">
        <a
          class="photo-card"
          th:each="photo, photoStat : ${photos.items}"
          th:with="imageUrl=${not #strings.isEmpty(photo.spec.cover) ? photo.spec.cover : photo.spec.url}"
          th:href="@{${photoUrl.detail(photo)}}"
          th:aria-label="${#messages.msg('page.photos.card.view', #strings.isEmpty(photo.spec.displayName) ? #messages.msg('page.photos.unnamed') : photo.spec.displayName)}"
          data-reveal
        >
          <span class="photo-card__media">
            <img
              src="./assets/images/moonlit-mountain-hero.jpg"
              th:src="${thumbnail.gen(imageUrl, 'm')}"
              th:srcset="|${thumbnail.gen(imageUrl, 's')} 400w, ${thumbnail.gen(imageUrl, 'm')} 800w, ${thumbnail.gen(imageUrl, 'l')} 1200w|"
              sizes="(max-width: 639px) calc(100vw - 64px), (max-width: 1023px) 46vw, 25vw"
              th:alt="${#strings.isEmpty(photo.spec.displayName) ? #messages.msg('page.photos.imageAlt') : photo.spec.displayName}"
              th:attr="width=${photo.exif != null ? photo.exif.imageWidth : null},height=${photo.exif != null ? photo.exif.imageHeight : null},loading=${photoStat.index < 3 ? 'eager' : 'lazy'},fetchpriority=${photoStat.first ? 'high' : null}"
              decoding="async"
            />
            <span
              class="photo-card__frame"
              th:text="|${#messages.msg('page.photos.frame')} ${#numbers.formatInteger(photoStat.count, 2)}|"
            ></span>
            <span class="photo-card__overlay">
              <strong
                th:text="${#strings.isEmpty(photo.spec.displayName) ? #messages.msg('page.photos.unnamed') : photo.spec.displayName}"
              ></strong>
              <span class="photo-card__exif" th:if="${photo.exif != null}">
                <span th:if="${not #strings.isEmpty(photo.exif.model)}" th:text="${photo.exif.model}"></span>
                <span th:if="${photo.exif.fNumber != null}" th:text="|f/${photo.exif.fNumber}|"></span>
                <span th:if="${photo.exif.focalLength != null}" th:text="|${photo.exif.focalLength}mm|"></span>
              </span>
            </span>
          </span>
        </a>
      </div>

      <div class="empty-state photo-empty" th:if="${#lists.isEmpty(photos.items)}">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 6.5h16v11H4zM8 6.5l1.4-2h5.2l1.4 2M8 13l2.2-2.2 2.1 2.1 1.5-1.5L18 15.5M16.5 9.5h.01" />
        </svg>
        <h2 th:text="#{page.photos.empty.title}"></h2>
        <p th:text="#{page.photos.empty.description}"></p>
      </div>

      <nav
        class="pagination photo-pagination"
        th:aria-label="#{page.photos.pagination.ariaLabel}"
        th:if="${photos.hasPrevious() || photos.hasNext()}"
      >
        <a
          th:if="${photos.hasPrevious()}"
          th:href="@{${photos.prevUrl}}"
          rel="prev"
          th:text="|← ${#messages.msg('common.previousPage')}|"
        ></a>
        <span><strong th:text="${photos.page}"></strong> / <span th:text="${photos.totalPages}"></span></span>
        <a
          th:if="${photos.hasNext()}"
          th:href="@{${photos.nextUrl}}"
          rel="next"
          th:text="|${#messages.msg('common.nextPage')} →|"
        ></a>
      </nav>
    </th:block>

    <div class="empty-state photo-empty" th:unless="${pluginFinder.available('PluginPhotos', '>=2.0.0')}">
      <h2 th:text="#{page.photos.pluginRequired.title}"></h2>
      <p th:text="#{page.photos.pluginRequired.description}"></p>
    </div>
  </section>
</include>
