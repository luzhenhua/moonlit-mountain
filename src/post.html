<include src="layout.html">
  <template name="head">
    <title th:text="|${post.spec.title} - ${site.title}|">文章标题 - 山月记</title>
  </template>

  <article class="article-shell container">
    <header class="article-hero">
      <h1 th:text="${post.spec.title}">文章标题</h1>
      <div class="article-meta">
        <dl class="article-facts">
          <div class="article-fact article-fact--author" th:if="${post.owner != null}">
            <dt th:text="#{page.post.author}">作者</dt>
            <dd>
              <a class="article-author" th:href="@{${post.owner.permalink}}">
                <span class="article-author__avatar" aria-hidden="true">
                  <img
                    th:if="${not #strings.isEmpty(post.owner.avatar)}"
                    th:src="${post.owner.avatar}"
                    th:alt="${post.owner.displayName ?: post.owner.name}"
                  />
                  <svg th:unless="${not #strings.isEmpty(post.owner.avatar)}" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7 8a7 7 0 0 0-14 0" /></svg>
                </span>
                <span th:text="${post.owner.displayName ?: post.owner.name}">作者名称</span>
              </a>
            </dd>
          </div>
          <div class="article-fact">
            <dt th:text="#{page.post.published}">发布于</dt>
            <dd>
              <time
                th:datetime="${post.spec.publishTime}"
                th:text="${#temporals.format(post.spec.publishTime, #messages.msg('date.format.long'))}"
              >2026年07月10日</time>
            </dd>
          </div>
          <div class="article-fact" th:if="${post.status.lastModifyTime != null}">
            <dt th:text="#{page.post.updated}">更新于</dt>
            <dd>
              <time
                th:datetime="${post.status.lastModifyTime}"
                th:text="${#temporals.format(post.status.lastModifyTime, #messages.msg('date.format.long'))}"
              >2026年07月17日</time>
            </dd>
          </div>
          <div class="article-fact">
            <dt th:text="#{page.post.readingTime}">阅读时长</dt>
            <dd><span data-reading-time aria-live="polite">—</span></dd>
          </div>
          <div class="article-fact">
            <dt th:text="#{page.post.visits}">访问量</dt>
            <dd><span th:text="${post.stats.visit}">0</span></dd>
          </div>
        </dl>
        <div class="article-meta__taxonomy" th:if="${not #lists.isEmpty(post.categories)}">
          <span class="article-meta__label" th:text="#{page.post.categories}">分类</span>
          <ul class="category-list" role="list" aria-label="文章分类" th:aria-label="#{page.post.categoriesAria}">
            <li th:each="category : ${post.categories}">
              <a class="category-chip" th:href="@{${category.status.permalink}}">
                <span class="category-chip__dot" aria-hidden="true"></span>
                <span th:text="${category.spec.displayName}">分类名称</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </header>

    <aside
      class="reader-tools"
      th:attr="data-share-title=${post.spec.title},data-reader-settings-enabled=${theme.config?.post?.enable_reader_settings != false}"
      th:aria-label="#{page.post.readerTools}"
      data-reader-tools
    >
      <div class="reader-tools__actions">
        <button type="button" data-article-share>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 16V3m0 0L7 8m5-5 5 5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" /></svg>
          <span th:text="#{page.post.share}">分享</span>
        </button>
        <button type="button" data-article-print>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 8V3h10v5M7 17H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M7 14h10v7H7z" /></svg>
          <span th:text="#{page.post.print}">打印</span>
        </button>
      </div>

      <details
        class="reader-settings"
        th:if="${theme.config?.post?.enable_reader_settings != false}"
        data-reader-settings
      >
        <summary>
          <span th:text="#{page.post.readerSettings}">阅读设置</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" /></svg>
        </summary>
        <div class="reader-settings__body">
          <div class="reader-setting">
            <div class="reader-setting__head">
              <label for="reader-font-size" th:text="#{page.post.fontSize}">字号</label>
              <output for="reader-font-size" data-reader-output="fontSize">17 px</output>
            </div>
            <input id="reader-font-size" type="range" min="15" max="21" step="1" value="17" data-reader-setting="fontSize" />
          </div>
          <div class="reader-setting">
            <div class="reader-setting__head">
              <label for="reader-line-height" th:text="#{page.post.lineHeight}">行高</label>
              <output for="reader-line-height" data-reader-output="lineHeight">1.80</output>
            </div>
            <input id="reader-line-height" type="range" min="1.55" max="2.05" step="0.05" value="1.8" data-reader-setting="lineHeight" />
          </div>
          <div class="reader-setting">
            <div class="reader-setting__head">
              <label for="reader-content-width" th:text="#{page.post.contentWidth}">正文宽度</label>
              <output for="reader-content-width" data-reader-output="contentWidth">750 px</output>
            </div>
            <input id="reader-content-width" type="range" min="640" max="860" step="10" value="750" data-reader-setting="contentWidth" />
          </div>
          <button class="reader-settings__reset" type="button" data-reader-reset th:text="#{page.post.resetReaderSettings}">恢复默认</button>
        </div>
      </details>
      <p class="reader-tools__feedback" role="status" aria-live="polite" data-reader-feedback></p>
    </aside>

    <aside
      class="article-toc"
      id="article-toc"
      aria-label="文章目录"
      th:aria-label="#{page.post.tocAria}"
      aria-hidden="true"
      data-article-toc
      hidden
      inert
    >
      <p class="eyebrow" th:text="#{page.post.tocEyebrow}">ON THIS PAGE</p>
      <nav data-toc-list></nav>
    </aside>
    <button
      class="toc-toggle"
      type="button"
      aria-label="打开文章目录"
      th:aria-label="#{page.post.openToc}"
      aria-controls="article-toc"
      aria-expanded="false"
      aria-hidden="true"
      data-toc-toggle
      hidden
    >
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></svg>
    </button>
    <button
      class="toc-backdrop"
      type="button"
      aria-label="关闭文章目录"
      th:aria-label="#{page.post.closeToc}"
      aria-controls="article-toc"
      aria-hidden="true"
      data-toc-backdrop
      hidden
      inert
      tabindex="-1"
    ></button>

    <img
      class="article-cover"
      th:if="${not #strings.isEmpty(post.spec.cover) and post.spec.cover != '0'}"
      th:src="${post.spec.cover}"
      th:alt="${post.spec.title}"
    />

    <div class="article-content" th:utext="${post.content.content}"></div>

    <footer class="article-tags" th:if="${not #lists.isEmpty(post.tags)}">
      <p class="article-tags__label" th:text="#{page.post.tagsLabel}">收录标签</p>
      <ul class="tag-list" role="list" aria-label="文章标签" th:aria-label="#{page.post.tagsAria}">
        <li th:each="tag : ${post.tags}">
          <a
            class="tag-chip"
            th:href="@{${tag.status.permalink}}"
            th:style="|--taxonomy-color: ${tag.spec.color ?: 'var(--nav-violet)'}|"
          >
            <span class="tag-chip__dot" aria-hidden="true"></span>
            <span th:text="|# ${tag.spec.displayName}|"># 标签</span>
          </a>
        </li>
      </ul>
    </footer>

    <nav class="post-nav" aria-label="相邻文章" th:aria-label="#{page.post.adjacentPosts}" th:with="cursor = ${postFinder.cursor(post.metadata.name)}">
      <a th:if="${cursor.hasPrevious()}" th:href="@{${cursor.previous.status.permalink}}">
        <span th:text="#{page.post.previousPost}">上一篇</span>
        <strong th:text="${cursor.previous.spec.title}"></strong>
      </a>
      <a th:if="${cursor.hasNext()}" th:href="@{${cursor.next.status.permalink}}">
        <span th:text="#{page.post.nextPost}">下一篇</span>
        <strong th:text="${cursor.next.spec.title}"></strong>
      </a>
    </nav>
  </article>

  <section
    class="related-posts"
    th:with="
      relatedCategoryName = ${#lists.isEmpty(post.categories) ? null : post.categories[0].metadata.name},
      relatedPosts = ${#strings.isEmpty(relatedCategoryName) ? postFinder.list({page: 1, size: 5}) : postFinder.list({page: 1, size: 5, categoryName: relatedCategoryName})}
    "
  >
    <div class="container" th:if="${not #lists.isEmpty(relatedPosts.items)}">
      <h2 th:text="#{page.post.continueReading}">继续阅读</h2>
      <div class="related-grid">
        <article class="recent-card" th:each="related, stat : ${relatedPosts.items}" th:if="${related.metadata.name != post.metadata.name and stat.index < 4}" data-reveal>
          <div class="recent-card__body">
            <h3><a th:href="@{${related.status.permalink}}" th:text="${related.spec.title}">文章标题</a></h3>
            <p class="post-meta"><time th:text="${#temporals.format(related.spec.publishTime, #messages.msg('date.format.short'))}">2026.07.10</time></p>
          </div>
          <a class="recent-card__media" th:href="@{${related.status.permalink}}" tabindex="-1">
            <img th:src="${(not #strings.isEmpty(related.spec.cover) and related.spec.cover != '0') ? related.spec.cover : #theme.assets('/images/moonlit-mountain-hero.jpg')}" th:alt="${related.spec.title}" loading="lazy" />
          </a>
        </article>
      </div>
    </div>
  </section>

  <section class="comment-shell container" th:if="${haloCommentEnabled}">
    <halo:comment group="content.halo.run" kind="Post" th:attr="name=${post.metadata.name}" />
  </section>
</include>
