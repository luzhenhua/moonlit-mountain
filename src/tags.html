<include src="layout.html">
  <template name="head">
    <title th:text="${#messages.msg('page.tags.title') + ' - ' + site.title}">标签 - 山月记</title>
  </template>

  <section class="listing-page container">
    <header class="listing-hero">
      <p class="eyebrow" th:text="#{page.tags.eyebrow}">TAGS</p>
      <h1 th:text="#{page.tags.heading}">全部标签</h1>
      <p th:text="#{page.tags.description}">一些反复出现、值得继续追问的词。</p>
    </header>

    <p class="empty-state" th:if="${#lists.isEmpty(tags)}" th:text="#{page.tags.empty}">还没有文章标签。</p>

    <ul class="tag-cloud" role="list">
      <li th:each="tag : ${tags}">
        <a
          class="tag-chip"
          th:href="@{${tag.status.permalink}}"
          th:style="|--taxonomy-color: ${tag.spec.color ?: 'var(--nav-violet)'}|"
        >
          <span class="tag-chip__dot" aria-hidden="true"></span>
          <span th:text="|# ${tag.spec.displayName}|"># 标签</span>
          <small th:text="${#messages.msg('common.postsCount', tag.postCount)}">0 篇</small>
        </a>
      </li>
    </ul>

  </section>
</include>
